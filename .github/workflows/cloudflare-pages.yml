name: Deploy ConCourse to Cloudflare Pages

on:
  push:
    branches:
      - cloudflare-migration

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-concourse-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Check, build, and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd1 # v6.0.2
        with:
          persist-credentials: false

      - name: Use the repository Node.js version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Run quality checks
        run: npm run check

      - name: Build the public Pages artifact
        run: npm run build:pages
        env:
          CONCOURSE_PUBLIC_ORIGIN: https://concourse-95c.pages.dev

      - name: Deploy the allowlisted artifact
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: pages deploy dist --project-name=concourse --branch=cloudflare-migration
