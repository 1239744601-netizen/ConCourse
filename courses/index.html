<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#03101e" />
  <title>Courses · ConCourse</title>
  <meta
    name="description"
    content="Search courses by title, code, faculty, instructor, term, or section."
  />
  <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico?v=20260731-double-c3" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png?v=20260731-double-c3" />
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=20260731-double-c3" />
  <link rel="manifest" href="../site.webmanifest?v=20260731-double-c3" />
  <meta name="apple-mobile-web-app-title" content="ConCourse" />
  <link rel="stylesheet" href="../course-tools/course-tools.css?v=20260803-masthead1" />
  <link rel="stylesheet" href="course-ambient.css?v=20260803-reef1" />
  <script>
    try {
      const savedTheme = localStorage.getItem("concourse_theme");
      const initialTheme = savedTheme === "day" || savedTheme === "night" ? savedTheme : "night";
      document.documentElement.dataset.theme = initialTheme;
      document.querySelector('meta[name="theme-color"]').content =
        initialTheme === "day" ? "#dff2ff" : "#061526";
    } catch (_error) {}
  </script>
</head>
<body class="course-ambient-page">
  <a class="skip-link" href="#courseSearchInput">Skip to course search</a>

  <header class="course-site-header">
    <div class="course-site-header-inner">
      <a class="course-brand" href="../" aria-label="ConCourse home" data-course-route="main">
        <span class="course-brand-mark" aria-hidden="true">
          <img class="brand-mark-night" src="../concourse-mark.svg" alt="" />
          <img class="brand-mark-day" src="../concourse-icon.svg" alt="" />
        </span>
        <span class="course-brand-copy">
          <strong>ConCourse</strong>
          <small data-copy="brandTag">Conquer your courses</small>
        </span>
      </a>

      <nav
        class="course-primary-navigation"
        aria-label="Primary destinations"
        data-copy-aria="primaryDestinations"
      >
        <a href="../" data-course-route="timetable" data-course-auth-only hidden data-copy="timetable">Timetable</a>
        <a href="./" aria-current="page" data-copy="exploreCourses">Courses</a>
        <a href="../" data-course-route="hub" data-course-auth-only hidden data-copy="studentHub">Student Hub</a>
      </nav>

      <div class="course-header-controls">
        <div
          class="course-theme-control"
          role="group"
          aria-label="Page appearance"
          data-copy-aria="appearance"
        >
          <button class="course-theme-option" type="button" data-theme-value="day" aria-pressed="false" data-copy-aria="useDay">
            <span class="course-theme-symbol course-theme-symbol-day" aria-hidden="true"></span>
            <span class="theme-label" data-copy="day">Day</span>
          </button>
          <button class="course-theme-option" type="button" data-theme-value="night" aria-pressed="true" data-copy-aria="useNight">
            <span class="course-theme-symbol course-theme-symbol-night" aria-hidden="true"></span>
            <span class="theme-label" data-copy="night">Night</span>
          </button>
        </div>
        <label class="course-language-control" for="languageSelect">
          <span class="course-language-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.65"></circle>
              <path d="M3.9 12h16.2M12 3.75c2.15 2.26 3.25 5.02 3.25 8.25S14.15 18 12 20.25C9.85 18 8.75 15.23 8.75 12S9.85 6.01 12 3.75Z" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"></path>
              <path d="M5.8 7.4h12.4M5.8 16.6h12.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".72"></path>
            </svg>
          </span>
          <span class="course-language-text" data-copy="languageLabel">Language</span>
          <select class="course-language-select" id="languageSelect" aria-label="Website language" data-copy-aria="language">
            <option value="en">English</option>
            <option value="zh-CN">普通话</option>
            <option value="zh-HK">粵語</option>
          </select>
          <span class="course-language-chevron" aria-hidden="true">
            <svg viewBox="0 0 12 12" width="12" height="12" fill="none"><path d="m3 4.75 3 3 3-3" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </label>
      </div>
    </div>
  </header>

  <main class="course-main">
    <section class="course-search-stage" aria-labelledby="courseSearchTitle">
      <h1 id="courseSearchTitle" data-copy="pageTitle">Courses</h1>
      <form class="course-search-form" id="courseSearchForm" role="search">
        <label class="visually-hidden" for="courseSearchInput" data-copy="searchLabel">
          Search the course catalogue
        </label>
        <div class="course-search-control">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"></circle>
            <path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
          <input
            id="courseSearchInput"
            name="query"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            required
            data-copy-placeholder="searchPlaceholder"
            placeholder="Course, code, or instructor"
          />
          <button id="courseSearchSubmit" type="submit" data-copy="search">Search</button>
        </div>
        <p class="course-community-bridge" data-copy="communityBridge">
          Discover courses. Find your community.
        </p>
      </form>
      <div class="course-aquarium" data-course-aquarium>
        <div class="course-aquarium-viewport" data-course-aquarium-viewport aria-hidden="true">
          <div class="course-aquarium-image"></div>
          <div class="course-aquarium-caustics"></div>
          <canvas class="course-aquarium-canvas" data-course-aquarium-canvas width="1" height="1"></canvas>
          <div class="course-aquarium-glass"></div>
        </div>
        <button class="course-community-action" type="button" data-course-community-action data-copy="communityAction" hidden>Meet the community</button>
      </div>
    </section>

    <section class="course-results" id="courseSearchResults" hidden aria-labelledby="courseResultsTitle">
      <header class="course-results-heading">
        <div>
          <h2 id="courseResultsTitle" tabindex="-1" data-copy="resultsTitle">Results</h2>
          <p id="courseSourceStatus"></p>
        </div>
        <p id="courseSearchStatus" role="status" aria-live="polite"></p>
      </header>
      <div class="course-result-list" id="courseResultList"></div>
    </section>
  </main>

  <script src="../navigation-state.js?v=20260731-unified1"></script>
  <script type="module" src="courses.mjs?v=20260803-reef1"></script>
  <script type="module" src="course-ambient.mjs?v=20260803-reef1"></script>
</body>
</html>
